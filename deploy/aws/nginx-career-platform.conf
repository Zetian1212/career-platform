# /etc/nginx/sites-available/career-platform (symlinked into sites-enabled; default site removed).
# Live copy after `certbot --nginx -d aws.zetiantao.me --redirect` (2026-11-01). To rebuild: install the port-80 block only, then rerun certbot.
server {
    server_name aws.zetiantao.me;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aws.zetiantao.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aws.zetiantao.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = aws.zetiantao.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aws.zetiantao.me;
    return 404; # managed by Certbot


}