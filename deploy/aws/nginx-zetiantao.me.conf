# /etc/nginx/sites-available/zetiantao.me (symlinked into sites-enabled). Production hostname.
# Certificate: first issued by DNS-01 before cutover (no HTTP route existed yet); renewed by webroot HTTP-01 after cutover.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zetiantao.me;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/zetiantao.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zetiantao.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name zetiantao.me;
    server_tokens off;

    # HTTP-01 renewals (certbot --webroot -w /var/www/letsencrypt).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
