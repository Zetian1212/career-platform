{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h1>Create project</h1>
  <form method="post" action="/admin/projects/new">
    <label>Title</label>
    <input name="title" type="text">
    <label>Slug</label>
    <input name="slug" type="text">
    <label>Summary</label>
    <textarea name="summary"></textarea>
    <label>State</label>
    <select name="state"><option value="draft">Draft</option><option value="published">Published</option></select>
    <label>Featured</label>
    <select name="featured"><option value="false">No</option><option value="true">Yes</option></select>
    <button type="submit">Save project</button>
  </form>
</section>
{% endblock %}
