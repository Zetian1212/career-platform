{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h1>Edit profile</h1>
  <form method="post" action="/admin/profile">
    <label>Name</label>
    <input name="name" type="text" value="{{ profile.name if profile else '' }}">
    <label>Headline</label>
    <input name="headline" type="text" value="{{ profile.headline if profile else '' }}">
    <label>Summary</label>
    <textarea name="summary">{{ profile.summary if profile else '' }}</textarea>
    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
